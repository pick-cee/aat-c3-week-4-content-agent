name: Validate content studio
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          AUTO_MIGRATE: "false"
          ENABLE_DEMO_LOGIN: "false"
      - run: npm audit --audit-level=moderate
