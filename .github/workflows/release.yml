name: Release scheduled content

on:
  schedule:
    - cron: "2-59/5 * * * *"
  # So a deploy can be tested without waiting for the next slot.
  workflow_dispatch:

concurrency:
  group: release-worker
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send anything that is due
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "APP_URL and CRON_SECRET must both be set as repository secrets."
            exit 1
          fi

          # --fail-with-body so a 401 or a 500 fails the run loudly and the
          # response is still printed. A silent scheduler is worse than none.
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 300 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -X POST "${APP_URL}/api/cron/release" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          echo "$response"
